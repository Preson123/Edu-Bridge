<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Portfolio — EduBridge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Newsreader:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #153e2e;
      --primary-light: #1e5640;
      --primary-dark: #0d281e;
      --secondary: #587965;
      --secondary-soft: #e2ece6;
      --accent: #d97736;
      --bg-body: #f8f6f0;
      --bg-surface: #ffffff;
      --bg-subtle: #f0ece1;
      --text-primary: #1c231f;
      --text-secondary: #4f5d54;
      --text-muted: #7d8b82;
      --border: #e2ddd4;
      --border-light: #ede8df;
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 16px;
      --radius-full: 9999px;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
      --shadow-md: 0 4px 12px rgba(21, 62, 46, 0.08);
      --shadow-lg: 0 12px 28px rgba(21, 62, 46, 0.12);
      --transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background: var(--bg-body);
      color: var(--text-primary);
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    /* Public Top Navigation Bar */
    .public-navbar {
      height: 70px;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand-wordmark {
      font-size: 1.45rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .brand-accent {
      font-family: 'Newsreader', Georgia, serif;
      font-style: italic;
      color: var(--secondary);
      font-weight: 400;
    }

    .public-nav-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-weight: 600;
      font-size: 13.5px;
      padding: 8px 16px;
      border-radius: var(--radius-md);
      cursor: pointer;
      border: 1px solid transparent;
      transition: var(--transition);
      font-family: inherit;
    }

    .btn-primary {
      background: var(--primary);
      color: #ffffff;
    }

    .btn-primary:hover {
      background: var(--primary-light);
    }

    .btn-outline {
      background: var(--bg-surface);
      border-color: var(--border);
      color: var(--text-primary);
    }

    .btn-outline:hover {
      background: var(--secondary-soft);
      border-color: var(--secondary);
      color: var(--primary);
    }

    .btn-sm {
      padding: 6px 12px;
      font-size: 12.5px;
    }

    /* Main Container */
    .portfolio-container {
      max-width: 1040px;
      width: 100%;
      margin: 40px auto 60px;
      padding: 0 24px;
      flex: 1;
    }

    /* Hero Profile Card */
    .hero-profile-card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 36px 40px;
      box-shadow: var(--shadow-sm);
      margin-bottom: 32px;
      position: relative;
    }

    .hero-profile-header {
      display: flex;
      align-items: flex-start;
      gap: 28px;
      flex-wrap: wrap;
    }

    .hero-avatar {
      width: 104px;
      height: 104px;
      border-radius: 50%;
      background: var(--secondary-soft);
      color: var(--primary);
      border: 3px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      font-weight: 800;
      overflow: hidden;
      flex-shrink: 0;
      box-shadow: var(--shadow-sm);
    }

    .hero-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .hero-details {
      flex: 1;
      min-width: 260px;
    }

    .hero-name-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .hero-name {
      font-size: 1.85rem;
      font-weight: 800;
      color: var(--text-primary);
      letter-spacing: -0.02em;
    }

    .verified-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11.5px;
      font-weight: 700;
      background: var(--secondary-soft);
      color: var(--primary);
      padding: 3px 10px;
      border-radius: var(--radius-full);
      border: 1px solid rgba(21, 62, 46, 0.15);
    }

    .hero-headline {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--secondary);
      margin-top: 4px;
    }

    .hero-meta-row {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-top: 8px;
      font-size: 13px;
      color: var(--text-muted);
      flex-wrap: wrap;
    }

    .hero-meta-item {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .hero-social-links {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 18px;
      flex-wrap: wrap;
    }

    .social-link-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: var(--radius-full);
      border: 1px solid var(--border);
      background: var(--bg-body);
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-primary);
      transition: var(--transition);
    }

    .social-link-btn:hover {
      background: var(--secondary-soft);
      border-color: var(--secondary);
      color: var(--primary);
    }

    /* Section Cards */
    .section-box {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 28px 32px;
      box-shadow: var(--shadow-sm);
      margin-bottom: 28px;
    }

    .section-title {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--text-primary);
      letter-spacing: -0.01em;
      margin-bottom: 16px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border-light);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-title svg {
      width: 20px;
      height: 20px;
      color: var(--primary);
    }

    .bio-text {
      font-size: 14.5px;
      line-height: 1.7;
      color: var(--text-secondary);
      white-space: pre-line;
    }

    /* Skills Pill Cloud */
    .skills-cloud {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .skill-pill {
      background: var(--bg-subtle);
      border: 1px solid var(--border);
      color: var(--primary);
      font-size: 13px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: var(--radius-full);
      transition: var(--transition);
    }

    .skill-pill:hover {
      background: var(--secondary-soft);
      border-color: var(--secondary);
    }

    /* Projects Grid */
    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
    }

    .public-project-card {
      background: var(--bg-body);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 14px;
      transition: var(--transition);
    }

    .public-project-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
      border-color: var(--secondary);
    }

    .proj-card-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.35;
      margin-bottom: 6px;
    }

    .proj-card-tech {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--secondary);
      margin-bottom: 10px;
      display: block;
    }

    .proj-card-desc {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.6;
    }

    .proj-card-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      padding-top: 12px;
      border-top: 1px dashed var(--border);
    }

    .proj-action-btn {
      font-size: 12px;
      font-weight: 600;
      padding: 5px 10px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--bg-surface);
      color: var(--text-primary);
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: var(--transition);
    }

    .proj-action-btn:hover {
      background: var(--secondary-soft);
      border-color: var(--secondary);
      color: var(--primary);
    }

    /* Timeline Items (Education & Certifications) */
    .timeline-item {
      padding-left: 20px;
      border-left: 2px solid var(--secondary-soft);
      margin-bottom: 16px;
      position: relative;
    }

    .timeline-item:last-child {
      margin-bottom: 0;
    }

    .timeline-item::before {
      content: '';
      position: absolute;
      left: -6px;
      top: 4px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--primary);
    }

    .timeline-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .timeline-sub {
      font-size: 12.5px;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    /* Private or Not Found State */
    .private-state-box {
      text-align: center;
      padding: 60px 24px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      max-width: 540px;
      margin: 40px auto;
    }

    .private-icon {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: #fef2f2;
      color: #b91c1c;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 18px;
    }

    /* Footer */
    .site-footer {
      background: var(--bg-surface);
      border-top: 1px solid var(--border);
      padding: 28px 24px;
      margin-top: auto;
      text-align: center;
      font-size: 12.5px;
      color: var(--text-muted);
    }

    @media (max-width: 768px) {
      .public-navbar {
        padding: 0 16px;
      }
      .portfolio-container {
        padding: 0 16px;
        margin-top: 24px;
      }
      .hero-profile-card {
        padding: 24px 20px;
      }
      .hero-avatar {
        width: 80px;
        height: 80px;
        font-size: 28px;
      }
      .hero-name {
        font-size: 1.5rem;
      }
      .section-box {
        padding: 20px;
      }
    }
  </style>
</head>
<body>

  <!-- Public Top Navigation Bar -->
  <header class="public-navbar">
    <a href="index.html" class="brand-wordmark">
      Edu<span class="brand-accent">Bridge</span>
    </a>

    <div class="public-nav-right">
      <a href="index.html" class="btn btn-outline btn-sm">
        Explore Opportunities
      </a>
      <a href="portfolio.html" id="ownerEditBtn" class="btn btn-primary btn-sm" style="display: none;">
        Edit Portfolio
      </a>
    </div>
  </header>

  <!-- Main Container (Rendered dynamically) -->
  <div id="portfolioRoot" class="portfolio-container">
    <div style="text-align: center; padding: 60px 0; color: var(--text-muted);">
      <div style="width: 36px; height: 36px; border: 3px solid #e2ddd4; border-top-color: #153e2e; border-radius: 50%; animation: spin 0.75s linear infinite; margin: 0 auto 14px;"></div>
      <div>Loading student portfolio...</div>
    </div>
    <style>
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </div>

  <!-- Footer -->
  <footer class="site-footer">
    <div>&copy; 2026 EduBridge &bull; Verified Student Showcase</div>
    <div style="margin-top: 4px; font-size: 11.5px;">Hosted statically via GitHub Pages &bull; Client-side verified student profile</div>
  </footer>

  <!-- Script to load & render public portfolio -->
  <script type="module">
    document.addEventListener('DOMContentLoaded', () => {
      const root = document.getElementById('portfolioRoot');
      const ownerEditBtn = document.getElementById('ownerEditBtn');

      let portfolio = null;

      // 1. Try decoding public data payload from URL hash (#p=...)
      if (window.location.hash && window.location.hash.startsWith('#p=')) {
        try {
          const rawHash = window.location.hash.slice(3);
          const decodedJson = decodeURIComponent(escape(atob(decodeURIComponent(rawHash))));
          portfolio = JSON.parse(decodedJson);
        } catch (e) {
          console.warn('Could not decode portfolio hash payload:', e);
        }
      }

      // 2. Fallback: Lookup by ID from query string or local storage cache
      if (!portfolio) {
        const urlParams = new URLSearchParams(window.location.search);
        const id = urlParams.get('id');
        if (id) {
          try {
            const raw = localStorage.getItem('edubridge_public_portfolio_' + id);
            if (raw) {
              portfolio = JSON.parse(raw);
            }
          } catch (e) {
            console.warn('Could not read cached public portfolio:', e);
          }
        }
      }

      // Check if current visitor has edit access (cached user or local owner)
      try {
        const urlParams = new URLSearchParams(window.location.search);
        const id = urlParams.get('id');
        if (id) {
          // If the viewer has this portfolio saved in their local storage draft, show Edit button
          const localDraft = localStorage.getItem('edubridge_public_portfolio_' + id);
          if (localDraft) {
            ownerEditBtn.style.display = 'inline-flex';
          }
        }
      } catch (e) {}

      // If portfolio not found or not published, show private state
      if (!portfolio) {
        root.innerHTML = `
          <div class="private-state-box">
            <div class="private-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="28" height="28">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
            </div>
            <h2 style="font-size: 1.35rem; font-weight: 800; color: var(--text-primary); margin-bottom: 8px;">Private or Unavailable Portfolio</h2>
            <p style="font-size: 13.5px; color: var(--text-secondary); line-height: 1.6; margin-bottom: 24px;">
              This student portfolio is currently in private draft mode or does not exist. If this is your portfolio, please sign in to EduBridge and click <strong>Publish Portfolio</strong> to share it.
            </p>
            <div style="display: flex; justify-content: center; gap: 10px;">
              <a href="portfolio.html" class="btn btn-primary btn-sm">Portfolio Editor</a>
              <a href="index.html" class="btn btn-outline btn-sm">Return Home</a>
            </div>
          </div>
        `;
        return;
      }

      // Render the student's published portfolio
      document.title = `${portfolio.displayName || 'Student'} — Portfolio | EduBridge`;

      function escapeHtml(str) {
        if (!str) return '';
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function cleanUrl(url) {
        if (!url) return '';
        if (url.startsWith('http://') || url.startsWith('https://')) return url;
        return 'https://' + url;
      }

      // Compute Initials
      const nameParts = (portfolio.displayName || 'ST').trim().split(/\s+/);
      const initials = nameParts.length >= 2 ? (nameParts[0][0] + nameParts[nameParts.length - 1][0]).toUpperCase() : portfolio.displayName.slice(0, 2).toUpperCase();

      // Skills List
      const skillsArray = portfolio.skills 
        ? portfolio.skills.split(',').map(s => s.trim()).filter(Boolean)
        : [];

      // Certifications List
      const certsArray = portfolio.certifications
        ? portfolio.certifications.split(',').map(c => c.trim()).filter(Boolean)
        : [];

      // Social Links
      const soc = portfolio.social || {};
      const socialButtons = [];
      if (soc.github) {
        socialButtons.push(`
          <a href="${cleanUrl(soc.github)}" target="_blank" rel="noopener noreferrer" class="social-link-btn" title="GitHub Profile">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14">
              <path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"></path>
            </svg>
            <span>GitHub</span>
          </a>
        `);
      }
      if (soc.linkedin) {
        socialButtons.push(`
          <a href="${cleanUrl(soc.linkedin)}" target="_blank" rel="noopener noreferrer" class="social-link-btn" title="LinkedIn Profile">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14">
              <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"></path>
              <rect x="2" y="9" width="4" height="12"></rect>
              <circle cx="4" cy="4" r="2"></circle>
            </svg>
            <span>LinkedIn</span>
          </a>
        `);
      }
      if (soc.website) {
        socialButtons.push(`
          <a href="${cleanUrl(soc.website)}" target="_blank" rel="noopener noreferrer" class="social-link-btn" title="Personal Website">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="2" y1="12" x2="22" y2="12"></line>
              <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
            </svg>
            <span>Website</span>
          </a>
        `);
      }
      if (soc.email) {
        socialButtons.push(`
          <a href="mailto:${escapeHtml(soc.email)}" class="social-link-btn" title="Contact Email">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
              <polyline points="22,6 12,13 2,6"></polyline>
            </svg>
            <span>Email</span>
          </a>
        `);
      }

      root.innerHTML = `
        <!-- Hero Profile Card -->
        <div class="hero-profile-card">
          <div class="hero-profile-header">
            <div class="hero-avatar">
              ${portfolio.avatarUrl ? `<img src="${portfolio.avatarUrl}" alt="${escapeHtml(portfolio.displayName)}">` : initials}
            </div>

            <div class="hero-details">
              <div class="hero-name-row">
                <h1 class="hero-name">${escapeHtml(portfolio.displayName)}</h1>
                <span class="verified-badge">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="12" height="12">
                    <polyline points="20 6 9 17 4 12"></polyline>
                  </svg>
                  Verified Student
                </span>
              </div>

              ${portfolio.headline ? `<div class="hero-headline">${escapeHtml(portfolio.headline)}</div>` : ''}

              <div class="hero-meta-row">
                ${portfolio.college ? `<span class="hero-meta-item">🏛️ ${escapeHtml(portfolio.college)}</span>` : ''}
                ${portfolio.degree ? `<span class="hero-meta-item">🎓 ${escapeHtml(portfolio.degree)}</span>` : ''}
                ${portfolio.location ? `<span class="hero-meta-item">📍 ${escapeHtml(portfolio.location)}</span>` : ''}
              </div>

              ${socialButtons.length > 0 ? `<div class="hero-social-links">${socialButtons.join('')}</div>` : ''}
            </div>
          </div>
        </div>

        <!-- About Me Section -->
        ${portfolio.bio ? `
          <div class="section-box">
            <div class="section-title">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
              About Me
            </div>
            <p class="bio-text">${escapeHtml(portfolio.bio)}</p>
          </div>
        ` : ''}

        <!-- Skills & Competencies -->
        ${skillsArray.length > 0 ? `
          <div class="section-box">
            <div class="section-title">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
              </svg>
              Skills & Core Competencies
            </div>
            <div class="skills-cloud">
              ${skillsArray.map(s => `<span class="skill-pill">${escapeHtml(s)}</span>`).join('')}
            </div>
          </div>
        ` : ''}

        <!-- Project Showcase -->
        <div class="section-box">
          <div class="section-title">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
              <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
            </svg>
            Featured Projects
          </div>

          ${(portfolio.projects && portfolio.projects.length > 0) ? `
            <div class="projects-grid">
              ${portfolio.projects.map(proj => `
                <div class="public-project-card">
                  <div>
                    <h3 class="proj-card-title">${escapeHtml(proj.title)}</h3>
                    ${proj.technologies ? `<span class="proj-card-tech">${escapeHtml(proj.technologies)}</span>` : ''}
                    <p class="proj-card-desc">${escapeHtml(proj.description || 'Project details and technical implementation summary.')}</p>
                  </div>

                  ${(proj.githubUrl || proj.demoUrl) ? `
                    <div class="proj-card-actions">
                      ${proj.githubUrl ? `
                        <a href="${cleanUrl(proj.githubUrl)}" target="_blank" rel="noopener noreferrer" class="proj-action-btn">
                          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="13" height="13">
                            <path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"></path>
                          </svg>
                          <span>Repository</span>
                        </a>
                      ` : ''}
                      ${proj.demoUrl ? `
                        <a href="${cleanUrl(proj.demoUrl)}" target="_blank" rel="noopener noreferrer" class="proj-action-btn">
                          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="13" height="13">
                            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
                            <polyline points="15 3 21 3 21 9"></polyline>
                            <line x1="10" y1="14" x2="21" y2="3"></line>
                          </svg>
                          <span>Live Demo</span>
                        </a>
                      ` : ''}
                    </div>
                  ` : ''}
                </div>
              `).join('')}
            </div>
          ` : `
            <div style="text-align: center; padding: 24px 0; color: var(--text-muted); font-size: 13.5px;">
              No public projects showcased yet.
            </div>
          `}
        </div>

        <!-- Certifications & Honors -->
        ${certsArray.length > 0 ? `
          <div class="section-box">
            <div class="section-title">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="8" r="7"></circle>
                <polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"></polyline>
              </svg>
              Certifications & Honors
            </div>
            <div>
              ${certsArray.map(c => `
                <div class="timeline-item">
                  <div class="timeline-title">${escapeHtml(c)}</div>
                  <div class="timeline-sub">Verified Academic & Professional Achievement</div>
                </div>
              `).join('')}
            </div>
          </div>
        ` : ''}
      `;
    });
  </script>
</body>
</html>
